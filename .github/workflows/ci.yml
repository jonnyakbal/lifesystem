name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
        env:
          AUTH_USER: test
          AUTH_PASSWORD: test-password-for-ci
          MCP_API_KEY: test-mcp-key-for-ci

      - name: Dump test output to job summary
        if: failure()
        run: |
          mkdir -p playwright-report
          tail -150 /tmp/test-output.txt | tee playwright-report/failure-tail.txt > "$GITHUB_STEP_SUMMARY"

      - name: Commit failure log to branch
        if: failure()
        run: |
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-bot"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout "$GITHUB_REF_NAME"
          tail -200 /tmp/test-output.txt > ci-test-output.txt
          git add ci-test-output.txt
          git commit -m "ci: anexa log de teste [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
